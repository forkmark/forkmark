    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0c0f1a; --surface: #161a2e; --surface2: #1c2138;
        --border: #252a3a; --accent: #7ba4f7; --green: #4ade80;
        --orange: #fbbf24; --red: #f87171; --purple: #c4a1f5;
        --text: #e0e4ef; --muted: #6b7394;
        --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
      body { background: var(--bg); color: var(--text); font-family: var(--font); }
      button { cursor: pointer; font-family: var(--font); }
      input, textarea, select { font-family: var(--font); }
      a { color: var(--accent); text-decoration: none; }
      /* Visible focus ring for keyboard navigation (WCAG 2.1 AA) */
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      /* ── Responsive breakpoints ────────────────────────────────────── */
      @media (max-width: 1100px) {
        /* Stack BranchCompare: comparison + decision panel side-by-side → vertical */
        [data-layout="compare"] { grid-template-columns: 1fr !important; }
        /* Stat cards: 4/5-col → 2-col on narrower screens */
        [data-layout="stats"] { grid-template-columns: repeat(2, 1fr) !important; }
      }
      @media (max-width: 900px) {
        #root > div > main { padding: 16px !important; }
        /* Playground side-by-side results → stacked */
        [data-layout="playground"] { grid-template-columns: 1fr !important; }
      }
      @media (max-width: 600px) {
        #root > div > main { padding: 12px !important; }
        /* Dashboard stat cards: 2-col → 1-col */
        [data-layout="stats"] { grid-template-columns: 1fr !important; }
      }
    </style>
